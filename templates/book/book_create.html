{% extends 'base.html' %}
{% load static %}

{% block title %}Add a Book — BookVault{% endblock %}

{% block content %}
<div class="form-page" style="align-items:flex-start; padding-top:56px;">
    <div class="form-card" style="max-width:620px;">
        <span class="eyebrow">Contribute</span>
        <h2>Add a New Book</h2>
        <p class="subtitle">Share a title with the BookVault community. Fill in the details below.</p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group">
                    <label>Book Title *</label>
                    <input type="text" name="title" class="form-control" placeholder="Enter title…" required>
                </div>
                <div class="form-group">
                    <label>Price ($) *</label>
                    <input type="number" name="price" class="form-control" placeholder="0.00" step="0.01" min="0" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Author *</label>
                    <select name="author" class="form-control" required style="background-color: #0f172a; color: white;">
    <option value="" style="color: #64748b;">Select author…</option>
    {% for author in authors %}
        <option value="{{ author.id }}" style="background-color: #1e293b; color: white;">
            {{ author.full_name }} {# Убедись, что поле называется именно name #}
        </option>
    {% endfor %}
</select>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select name="category" class="form-control" required>
                        <option value="">Select category…</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="4" placeholder="A brief synopsis or description of the book…"></textarea>
            </div>

            <div class="form-group">
                <label>Cover Image</label>
                <div class="file-input-wrap">
                    <input type="file" name="cover_image" accept="image/*" onchange="this.nextElementSibling.querySelector('p').textContent = this.files[0]?.name || 'Click to choose a cover image'">
                    <div>
                        <span>🖼</span>
                        <p>Click to choose a cover image</p>
                    </div>
                </div>
            </div>

            <div class="form-footer">
                <button type="submit" class="btn btn-gold">Publish Book →</button>
                <a href="{% url 'book_list' %}" class="btn btn-ghost" style="justify-content:center;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
