{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password — BookVault{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <span class="eyebrow">Account Recovery</span>
        <h2>Reset Password</h2>
        <p class="subtitle">Enter the email address linked to your account and we'll send you a reset link.</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
            </div>

            <div class="form-footer">
                <button type="submit" class="btn btn-gold">Send Reset Link →</button>
                <a href="{% url 'login' %}" class="btn btn-ghost" style="justify-content:center;">Back to Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
