{% extends 'base.html' %}
{% load static %}

{% block title %}Change Password — BookVault{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <span class="eyebrow">Security</span>
        <h2>Change Password</h2>
        <p class="subtitle">Choose a strong new password to keep your account secure.</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" name="old_password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" class="form-control" placeholder="At least 8 characters" required>
            </div>

            <div class="form-footer">
                <button type="submit" class="btn btn-gold">Update Password →</button>
                <a href="{% url 'home' %}" class="btn btn-ghost" style="justify-content:center;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
